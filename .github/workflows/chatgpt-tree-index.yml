name: ChatGPT Tree Index

on:
  push:
    branches: [chatgpt/current-build]
    paths:
      - 'scripts/chatgpt_extract_tree_index.py'
      - 'scripts/chatgpt_match_clusters.py'
      - 'Builds/extract-target-nodes.py'
      - '.github/workflows/chatgpt-tree-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/current-build
      - name: Generate compact node index
        run: python scripts/chatgpt_extract_tree_index.py
      - name: Generate targeted node index
        run: python Builds/extract-target-nodes.py
      - name: Match screenshot cluster geometry
        run: python scripts/chatgpt_match_clusters.py
      - name: Upload generated data
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-tree-data
          path: |
            Builds/tree-node-index.csv
            Builds/target-node-index.csv
            Builds/cluster-match-candidates.txt
      - name: Commit generated indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Builds/tree-node-index.csv Builds/target-node-index.csv Builds/cluster-match-candidates.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Generate passive tree indexes and cluster matches [skip ci]'
          git push origin HEAD:chatgpt/current-build
